[package]
name = "claude-status-line"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Claude Code status line renderer"
repository = "https://github.com/chewygumxx/claude-status-line"

[dependencies]
dirs = "6.0.0"
owo-colors = "4.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
supports-color = "3.0.2"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
